# Ultralytics ByteTrack configuration tuned for Soccer Match Video Analytics (imgsz=1280)
# Optimized for broadcast camera views, panning motion, occluded crossings, and sustained persistence.

tracker_type: bytetrack
track_high_thresh: 0.30      # High-confidence threshold for stage-1 Kalman association
track_low_thresh: 0.10       # Low-confidence threshold for stage-2 association of occluded players
new_track_thresh: 0.40       # Threshold required to spawn a new candidate player track
track_buffer: 90             # Frame memory (~2.7s at 33 fps) before dropping occluded/exited players
match_thresh: 0.85           # IoU distance threshold (IoU >= 0.15) to sustain IDs through fast sprints/pans
fuse_score: True             # Prioritize high-confidence detections during close player/referee crossings
