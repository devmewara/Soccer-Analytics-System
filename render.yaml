# Render Blueprint for PitchVision AI Backend (FastAPI + YOLO11n + ByteTrack)
# Note: PyTorch + YOLO11n video inference requires ~1.0-1.5 GB RAM.
# Use the Standard plan (2 GB RAM) or higher; Render Free (512 MB) will OOM during video analysis.

services:
  - type: web
    name: pitchvision-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "False"
      - key: YOLO_MODEL_PATH
        value: /app/models/yolo11n.pt
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "200"
      # Replace with your deployed Vercel frontend URL (comma-separated, no trailing slashes)
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:5173
      # Optional: allow Vercel preview deployments
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
    # Optional: Uncomment to persist uploaded/annotated videos across redeploys (paid Render disk)
    # disk:
    #   name: pitchvision-uploads
    #   mountPath: /app/uploads
    #   sizeGB: 5
